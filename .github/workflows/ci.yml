name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enforce BootCampSmc Gate 4A safety boundary
        shell: pwsh
        run: |
          $forbiddenPatterns = @(
            '\bMmMapIoSpace\s*\(',
            'PAGE_READWRITE',
            'PAGE_EXECUTE',
            'READ_REGISTER_',
            'WRITE_REGISTER_',
            'READ_PORT_',
            'WRITE_PORT_',
            '__inbyte',
            '__outbyte',
            'MmCopyMemory',
            'RtlCopyMemory',
            '\bmemcpy\b',
            '\bmemmove\b',
            'WdfInterruptCreate',
            'WdfIoQueueCreate',
            'WdfDeviceCreateDeviceInterface',
            'CTL_CODE',
            'IOCTL_'
          )

          $files = Get-ChildItem `
            -Path '.\drivers\BootCampSmc' `
            -File `
            -Include '*.c','*.h' `
            -Recurse

          $matches = $files | Select-String -Pattern $forbiddenPatterns

          if ($matches) {
            Write-Error 'BootCampSmc Gate 4A violation: writable/executable MMIO, register/port access, interrupt connection, memory-copy access, or device-control surface was introduced.'
            $matches | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            exit 1
          }

          $sourcePath = '.\drivers\BootCampSmc\BootCampSmc.c'
          $source = Get-Content $sourcePath

          $mapCalls = @($source | Select-String -Pattern '\bMmMapIoSpaceEx\s*\(')
          $unmapCalls = @($source | Select-String -Pattern '\bMmUnmapIoSpace\s*\(')
          $readOnlyProtection = @($source | Select-String -SimpleMatch 'PAGE_READONLY | PAGE_NOCACHE')

          if ($mapCalls.Count -ne 1) {
            Write-Error "Gate 4A requires exactly one MmMapIoSpaceEx call; found $($mapCalls.Count)."
            exit 1
          }

          if ($unmapCalls.Count -ne 1) {
            Write-Error "Gate 4A requires exactly one MmUnmapIoSpace call; found $($unmapCalls.Count)."
            exit 1
          }

          if ($readOnlyProtection.Count -ne 1) {
            Write-Error 'Gate 4A requires exactly one PAGE_READONLY | PAGE_NOCACHE mapping.'
            exit 1
          }

          $allowedMmioReferencePatterns = @(
            'if \(context->MmioBase != NULL\)',
            'context->MmioBase = MmMapIoSpaceEx\(',
            'if \(context->MmioBase == NULL\)',
            'MmUnmapIoSpace\(context->MmioBase, context->MmioLength\);'
          )

          $unexpectedMmioReferences = @(
            $source |
              Select-String -SimpleMatch 'context->MmioBase' |
              Where-Object {
                $line = $_.Line
                -not ($allowedMmioReferencePatterns | Where-Object { $line -match $_ })
              }
          )

          if ($unexpectedMmioReferences.Count -ne 0) {
            Write-Error 'Gate 4A violation: MMIO mapping pointer is referenced outside map/null-check/unmap lifecycle.'
            $unexpectedMmioReferences | ForEach-Object {
              Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
            }
            exit 1
          }

          Write-Host 'BootCampSmc Gate 4A safety boundary: PASS'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BootCampPerformanceControl.sln

      - name: Build
        run: |
          dotnet build BootCampPerformanceControl.sln `
            --configuration Release `
            --no-restore

      - name: Test
        run: |
          dotnet test BootCampPerformanceControl.sln `
            --configuration Release `
            --no-build `
            --no-restore
